name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Primary quality (Go 1.27.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true

      - name: Verify Go toolchain
        run: test "$(go env GOVERSION)" = go1.27.0

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: 'v2.13.1'
          install-mode: binary

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Static build
        run: |
          CGO_ENABLED=0 go build -trimpath ./cmd/herdr-file-viewer
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/herdr-file-viewer ./cmd/herdr-file-viewer

  minimum-compatibility:
    name: Minimum compatibility (Go 1.25.14)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: true

      - name: Verify Go toolchain
        run: |
          test "$(go env GOVERSION)" = go1.25.14
          test "$(go env GOTOOLCHAIN)" = local

      - name: Test
        run: go test ./...

      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/herdr-file-viewer
