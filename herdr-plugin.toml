id = "u7chan.file-viewer"
name = "Herdr File Viewer"
version = "0.1.0"
min_herdr_version = "0.8.2"
platforms = ["linux"]

[[panes]]
id = "files"
title = "Files"
placement = "split"
command = ["./bin/herdr-file-viewer"]

# One-shot session restore: after a cold restore Herdr brings the Files /
# Preview panes back as plain shells with their labels, and this hook execs
# the viewer binary back into those panes in place. It must exit; the hook
# never starts a TUI (HERDR_PLUGIN_EVENT=startup is handled before the
# entrypoint checks).
[[startup]]
command = ["./bin/herdr-file-viewer"]

[[panes]]
id = "preview"
title = "Preview"
placement = "split"
command = ["./bin/herdr-file-viewer"]

[[panes]]
id = "help"
title = "Help"
placement = "popup"
width = 76
height = 18
command = ["./bin/herdr-file-viewer"]

[[actions]]
id = "open-file-viewer"
title = "Open file viewer"
description = "Open the file viewer in a right split beside the current pane."
command = [
  "herdr", "plugin", "pane", "open",
  "--plugin", "u7chan.file-viewer",
  "--entrypoint", "files",
  "--placement", "split",
  "--direction", "right",
  "--focus",
]
